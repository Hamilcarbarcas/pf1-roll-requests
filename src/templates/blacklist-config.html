<div class="arr-blacklist">
    {{#if actors.length}}
    <p class="arr-blacklist-hint">
        {{localize "RR.Blacklist.Hint"}}
    </p>
    <ul class="arr-blacklist-list">
        {{#each actors}}
        <li class="arr-blacklist-row flexrow{{#if this.missing}} arr-blacklist-missing{{/if}}">
            <img src="{{this.img}}" class="arr-blacklist-img" alt="{{this.name}}" />
            <span class="arr-blacklist-name">{{this.name}}</span>
            <button type="button" class="arr-blacklist-remove" data-action="removeActor" data-actor-id="{{this.id}}">
                <i class="fa-solid fa-trash"></i> {{localize "RR.Blacklist.Remove"}}
            </button>
        </li>
        {{/each}}
    </ul>
    {{else}}
    <p class="arr-blacklist-empty">{{localize "RR.Blacklist.Empty"}}</p>
    {{/if}}
</div>
